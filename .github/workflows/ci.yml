name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt
      - name: Install pinned dependency auditor
        run: python -m pip install "pip-audit==2.10.1"
      - name: Audit production and development requirements
        run: |
          python -m pip_audit --strict --progress-spinner off --requirement server/requirements.txt
          python -m pip_audit --strict --progress-spinner off --requirement server/requirements-dev.txt

  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install --requirement server/requirements-dev.txt
      - name: Run API and concurrency tests
        run: python -m pytest -q
      - name: Validate browser scripts and deployment scripts
        run: |
          node --check web/admin.js
          node --check web/student.js
          node --check web/receipt.js
          bash -n deploy/bootstrap.sh
          bash -n deploy/install-cloudflared.sh
          bash -n deploy/update.sh
      - name: Build production image
        run: docker build --build-arg APP_VERSION="${GITHUB_SHA}" --tag teaching-group-choice:ci .
