services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: teaching-group-choice:${APP_VERSION:-local}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "${ORIGIN_BIND:-127.0.0.1}:80:8080"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${APP_MEMORY_LIMIT:-1g}
    cpus: ${APP_CPU_LIMIT:-1.5}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 20s
      timeout: 4s
      retries: 3
      start_period: 15s
